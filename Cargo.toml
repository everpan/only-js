[workspace]
members = ["server"]

[package]
name = "mdm-base-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
deno_core = "0.409"
deno_error = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 已 deprecated 但功能完备；仅内部配置解析（Go 侧用 go.yaml.in/yaml/v3）。
serde_yaml = "0.9"
sea-query = "0.32"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "any",
    "mysql",
    "postgres",
    "sqlite",
    "json",
] }
notify = "6"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread"] }

[[bench]]
name = "bridge"
harness = false
